   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #138c92" x="55.51344" y="144.3024" transform="rotate(-0 55.51344 144.3024)">SHORT-LIVED BODY CONTINUITY</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="73.3248" y="221.051081" transform="rotate(-0 73.3248 221.051081)">Inner person crop</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 258.870178)">Normalized detection box</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 277.020178)">x: 20–80% of box width</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 294.104553)">y: 20–70% of box height</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 312.254553)">Minimum crop dimension: 8 px</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="402.83496" y="221.052097" transform="rotate(-0 402.83496 221.052097)">HSV colour evidence</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 257.707443)">BGR → OpenCV HSV</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 275.954553)">Reject mean Value below 12</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 294.523068)">Hue: [0, 180), 12 bins</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 312.673068)">Saturation: [0, 256), 4 bins</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="732.34512" y="221.052097" transform="rotate(-0 732.34512 221.052097)">48-bin descriptor</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 257.804552)">Joint H × S histogram</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 277.020178)">L1 normalization: sum = 1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 295.170178)">Flatten 12 × 4 bins</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 312.254553)">Value is not a colour input</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="1061.85528" y="221.052097" transform="rotate(-0 1061.85528 221.052097)">Continuity gate</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 258.086428)">Coefficient: Σ √(pᵢqᵢ) ≥ 0.80</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 275.954553)">Box overlap: IoU ≥ 0.20</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 294.104553)">Fresh, unique body observation</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 312.254553)">Original face anchor retained</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c58a25" x="55.51344" y="443.2032" transform="rotate(-0 55.51344 443.2032)">INDEPENDENT PERSON-CROP BRANCHES: WARDROBE / PARTIAL VIEW</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="73.3248" y="519.952897" transform="rotate(-0 73.3248 519.952897)">Proportional bands</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 556.485165)">Person crop; central x: 15–85%</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 574.305165)">Upper: y15–50%; lower: 50–85%</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 592.620446)">Footwear: 85–100%; whole: 10–90%</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(73.3248 609.945165)">Texture = capped Laplacian(V)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="402.83496" y="519.952897" transform="rotate(-0 402.83496 519.952897)">Wardrobe appearance</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 557.531415)">Each band: normalized HS48</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 574.581915)">Colour: Σ √(pᵢqᵢ)</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 593.171415)">Score: 0.90 colour + 0.10 texture</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(402.83496 609.945165)">Average over common bands</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="732.34512" y="519.952897" transform="rotate(-0 732.34512 519.952897)">Eight ordered strips</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 556.485165)">Unlabelled y bands; x20–80%</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 575.351415)">Each: HS48 + Value8 + texture</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 592.125165)">Align contiguous 4–8 strips</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(732.34512 609.945165)">Search both alignment directions</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="1061.85528" y="519.952897" transform="rotate(-0 1061.85528 519.952897)">Partial-view score</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 557.531415)">0.65 HS + 0.25 Value + 0.10 texture</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 574.305165)">Mean over eight aligned pairs</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 593.171415)">Partial candidate threshold: 0.90</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52657a" transform="translate(1061.85528 609.945165)">Identity requires separate binding</text>
   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b45" x="47.88" y="44.340094" transform="rotate(-0 47.88 44.340094)">Appearance descriptors: geometry, colour and continuity</text>
  </g>
  <g id="text_20">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52657a" x="47.88" y="80.398125" transform="rotate(-0 47.88 80.398125)">Schematic of the production descriptor functions; proportional bands do not imply anatomical segmentation.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52657a" x="47.88" y="770.589656" transform="rotate(-0 47.88 770.589656)">Geometric and descriptor schematic • HS similarity is an appearance score, not an identity probability • No image capture or model inference</text>
  </g>
 </g>
