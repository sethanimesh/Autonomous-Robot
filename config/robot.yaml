ev3_bridge:
  ros__parameters:
    ev3_host: 192.168.1.25
    ev3_port: 9999
    wheel_radius_m: 0.0144504
    track_width_m: 0.182557
    left_sign: 1
    right_sign: 1
    max_motor_speed: 120
    encoder_counts_per_rev: 360
    command_timeout_sec: 0.3
    update_rate_hz: 10.0
    odom_frame: odom
    base_frame: base_link
    publish_odom_tf: true
    camera_head_calibrated: true
    # Motor A's encoder counts increase as the lens tilts DOWN (positive = down,
    # negative = up). A live 15-degree sequence on 2026-09-04 moved from ceiling
    # through the wall/ceiling edge and into a forward room view at the old +81;
    # that verified forward view was then re-zeroed to 0. A reconnect-and-repeat
    # test returned 0 -> +17 -> +2 with matching forward and route-view frames,
    # Live camera validation after the 2026-09-04 reboot/re-zero found a clear
    # room/person view at 13 and a useful near-floor route view at 31.
    camera_head_forward_position: 13
    camera_head_down_position: 31
    camera_head_minimum_position: -5
    camera_head_maximum_position: 70
    camera_head_speed: 300
    camera_head_max_jog_degrees: 15
