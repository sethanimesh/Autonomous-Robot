ev3_bridge:
  ros__parameters:
    ev3_host: 192.168.1.25
    ev3_port: 9999
    wheel_radius_m: 0.0144504
    track_width_m: 0.182557
    left_sign: 1
    right_sign: 1
    max_motor_speed: 120
    encoder_counts_per_rev: 360
    command_timeout_sec: 0.3
    update_rate_hz: 10.0
    odom_frame: odom
    base_frame: base_link
    publish_odom_tf: true
    camera_head_calibrated: false
    # Motor A's encoder counts increase as the lens tilts DOWN (positive = down,
    # negative = up). A live 15-degree sequence on 2026-09-04 moved from ceiling
    # through the wall/ceiling edge and into a forward room view at the old +81;
    # that verified forward view was then re-zeroed to 0. Named moves remain
    # disabled until the floor view and repeatability are measured.
    camera_head_forward_position: 0
    camera_head_down_position: 0
    camera_head_minimum_position: -180
    camera_head_maximum_position: 180
    camera_head_speed: 1000
    camera_head_max_jog_degrees: 15
